<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robo Kyle server</title>
    <meta name="description" content="The Robo Kyle server: the API behind robokyle.org and the tools that run here." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/public/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #faf7f2;
        --bg-elev: #ffffff;
        --ink: #171b26;
        --ink-soft: #444b5c;
        --ink-mute: #6b7280;
        --line: #e4dcce;
        --brand: #1f5f6e;
        --brand-ink: #ffffff;
        --ok: #2e7d57;
        --warn: #c46a18;
        --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-display: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #14171f;
          --bg-elev: #1c2029;
          --ink: #f1eee8;
          --ink-soft: #c5c9d3;
          --ink-mute: #8b91a0;
          --line: #2c3140;
          --brand: #5fb0c2;
          --brand-ink: #0f1a1e;
          --ok: #5bc48f;
          --warn: #e69a4a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.5;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      main { width: 100%; max-width: 480px; }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .brand img { width: 44px; height: 44px; }
      .brand h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.75rem;
        margin: 0;
        line-height: 1.1;
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--ink-mute);
        font-size: 0.9rem;
      }
      .panel {
        background: var(--bg-elev);
        border: 1px solid var(--line);
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      .btn {
        display: block;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05rem;
        padding: 14px 16px;
        border: 1px solid var(--brand);
        background: var(--brand);
        color: var(--brand-ink);
      }
      .btn small {
        display: block;
        font-weight: 400;
        font-size: 0.85rem;
        opacity: 0.85;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn:focus-visible { outline: 3px solid #8c6a1c; outline-offset: 2px; }
      .btn[aria-disabled="true"] {
        background: transparent;
        color: var(--ink-mute);
        border-color: var(--line);
        cursor: not-allowed;
        filter: none;
      }
      .status {
        margin: 16px 0 0;
        color: var(--ink-mute);
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink-mute);
      }
      .dot.ok { background: var(--ok); }
      .dot.down { background: var(--warn); }
      code { font-family: var(--font-mono); font-size: 0.85em; }
      .site { margin-top: 24px; font-size: 0.9rem; color: var(--ink-soft); }
      .site a { color: var(--brand); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/public/logo.png" alt="" width="44" height="44" />
        <div>
          <h1>Robo Kyle server</h1>
          <p>The machine behind robokyle.org</p>
        </div>
      </div>

      <nav class="panel" aria-label="Tools on this server">
        <a class="btn" href="/brunel/">
          Virtual Brunel Hand
          <small>3D hand driven by the Open Bionics API, plus an EMG band</small>
        </a>
        <a class="btn" aria-disabled="true" role="link" tabindex="-1" onclick="return false">
          Factum
          <small>Coming soon</small>
        </a>
      </nav>

      <p class="status">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <span id="statusText">Checking the API&hellip;</span>
      </p>

      <p class="site">The public site is at <a href="https://robokyle.org">robokyle.org</a>.</p>
    </main>
    <script>
      (async () => {
        const dot = document.getElementById('dot');
        const text = document.getElementById('statusText');
        try {
          const res = await fetch('/api/health');
          const ok = res.ok && (await res.json()).ok;
          dot.classList.add(ok ? 'ok' : 'down');
          text.textContent = ok ? 'API online' : 'API answering, but not healthy';
        } catch {
          dot.classList.add('down');
          text.textContent = 'API unreachable';
        }
      })();
    </script>
  </body>
</html>
