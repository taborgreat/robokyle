# factum.robokyle.org -- self-hosted Node API + React frontend.
#
# Unlike the main site (GitHub Pages), this vhost is served entirely from this
# machine. That means nginx can answer client-side routes with a real 200 via
# try_files, so Factum can be a full React SPA with no 404-status caveat and no
# need to keep any pages as flat HTML.
#
# BOOTSTRAP config: HTTP only, no ssl_certificate lines -- nginx refuses to load
# a config naming a cert that does not exist yet, which would block the certbot
# run that creates it. certbot rewrites this block in place and adds the
# port-80 -> https redirect itself.
#
#   1. sudo cp backend/deploy/nginx-factum.robokyle.org.conf /etc/nginx/sites-available/factum.robokyle.org
#      sudo ln -s /etc/nginx/sites-available/factum.robokyle.org /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   2. sudo certbot --nginx -d factum.robokyle.org

server {
    listen 80;
    listen [::]:80;
    server_name factum.robokyle.org;

    # The React build output (vite's `dist/`). Factum lives inside the robokyle
    # repo but is served from disk by nginx, NOT by GitHub Pages -- so unlike the
    # robokyle app bundle, this dist/ is gitignored and never committed.
    # nginx serving the static files directly is faster than proxying them
    # through Node, and keeps the Node process responsible only for the API.
    root /home/tabor/github/robokyle/Factum/frontend/dist;
    index index.html;

    client_max_body_size 100m;

    # Hashed asset filenames never change contents, so they can cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API. Node listens on 4100 -- 4000 is already the robokyle.org API.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback: unknown paths return index.html with a 200, so React Router
    # handles them. This is what Pages cannot do -- hence app.html/404.html there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
