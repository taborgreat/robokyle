# Reverse proxy for the robokyle.org API, self-hosted on this machine.
#
# This is the BOOTSTRAP config: HTTP only, no ssl_certificate lines. That is
# deliberate -- nginx refuses to load a config naming a cert file that does not
# exist yet, which would block the very certbot run that creates it.
#
#   1. sudo cp backend/deploy/nginx-api.robokyle.org.conf /etc/nginx/sites-available/api.robokyle.org
#      sudo ln -s /etc/nginx/sites-available/api.robokyle.org /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   2. sudo certbot --nginx -d api.robokyle.org
#
# certbot rewrites THIS server block in place -- adding `listen 443 ssl`, the
# ssl_certificate lines and the options-ssl-nginx include -- and appends a
# separate port-80 block that 301s to https. Everything below (proxy headers,
# body size, timeouts) is carried into the TLS block automatically, so it only
# needs to be stated once, here.

server {
    listen 80;
    listen [::]:80;
    server_name api.robokyle.org;

    # Design uploads: multer allows 50MB per file (MAX_UPLOAD_MB) across up to
    # 20 files. nginx caps the *whole* request body, so this is the real ceiling
    # a single multi-file upload can hit. Raise it if that's too tight.
    client_max_body_size 200m;

    # A 200MB upload over a home connection takes a while; the defaults (60s)
    # would kill it mid-transfer.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    client_body_timeout   300s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
