<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RoboKyle: Fly Game</title>
    <meta name="description" content="Fly over an endless island world. Steer with the cursor, click to fire.">
    <link rel="icon" type="image/png" href="/public/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fly-game.css?v=16">

    <!-- three.js resolves from the copy vendored at /public/vendor/three.
         The import map has to come before any module script that needs it,
         and the trailing slash on "three/addons/" is what makes that key a
         prefix rather than an exact match. -->
    <script type="importmap">
    {
      "imports": {
        "three": "/public/vendor/three/build/three.module.min.js",
        "three/addons/": "/public/vendor/three/addons/"
      }
    }
    </script>
</head>
<body class="fly-body">

    <a class="skip-link" href="#fly-frame">Skip to the game</a>

    <div class="game-shell">
        <div class="game-frame" id="fly-frame">

            <!-- ==================== TITLE ==================== -->
            <section class="screen is-title active" id="screen-title">
                <div class="title-inner">
                    <h1 class="fly-logo">
                        <span class="robo">Robo</span><span class="kyle">Kyle</span>
                        <span class="sub">Fly Game</span>
                    </h1>
                    <ul class="menu-list">
                        <li><button class="menu-btn is-primary" id="btn-play" type="button">Play</button></li>
                        <li><button class="menu-btn" id="btn-settings" type="button">Settings</button></li>
                    </ul>
                </div>
            </section>

            <!-- ==================== MAP SELECT ==================== -->
            <section class="screen" id="screen-maps">
                <div class="sheet">
                    <div class="topbar">
                        <button class="menu-back" data-goto="title" type="button">Back</button>
                        <h2 class="screen-title">Choose a map</h2>
                    </div>
                    <ul class="map-list" id="map-list"></ul>
                </div>
            </section>

            <!-- ==================== SETTINGS ==================== -->
            <section class="screen" id="screen-settings">
                <div class="sheet">
                    <div class="topbar">
                        <button class="menu-back" data-goto="title" type="button">Back</button>
                        <h2 class="screen-title">Settings</h2>
                    </div>

                    <h3 class="group-head">Aircraft</h3>
                    <ul class="craft-list" id="craft-list"></ul>

                    <h3 class="group-head">Flying</h3>
                    <label class="opt-row"><span>Steering sensitivity</span>
                        <input type="range" id="opt-sens" min="1" max="10" value="5"></label>
                    <label class="opt-check"><input type="checkbox" id="opt-invert">
                        <span>Invert up and down</span></label>

                    <h3 class="group-head">Sound</h3>
                    <label class="opt-row"><span>Volume</span>
                        <input type="range" id="opt-vol" min="0" max="10" value="7"></label>
                </div>
            </section>

            <!-- ==================== FLYING ==================== -->
            <section class="screen is-fly" id="screen-fly">
                <div class="fly-wrap">
                    <canvas id="fly-canvas"></canvas>

                    <div class="reticle" id="reticle" aria-hidden="true">
                        <svg viewBox="0 0 40 40" focusable="false">
                            <circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".65"/>
                            <circle cx="20" cy="20" r="1.8" fill="currentColor"/>
                            <path d="M20 2v6M20 32v6M2 20h6M32 20h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
                        </svg>
                    </div>

                    <div class="hud" aria-live="off">
                        <div class="gauge">
                            <span class="k">Speed</span>
                            <span class="v" id="hud-speed">0</span>
                            <span class="u">mph</span>
                        </div>
                        <div class="gauge">
                            <span class="k">Altitude</span>
                            <span class="v" id="hud-alt">0</span>
                            <span class="u">ft</span>
                        </div>
                    </div>

                    <div class="fly-flash" id="fly-flash" aria-hidden="true"></div>

                    <div class="fly-pause" id="fly-pause" hidden>
                        <div class="pause-card">
                            <h2>Paused</h2>
                            <ul class="menu-list">
                                <li><button class="menu-btn is-primary" id="btn-resume" type="button">Keep flying</button></li>
                                <li><button class="menu-btn" id="btn-quit" type="button">Menu</button></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

            <noscript><p class="noscript">Fly Game needs JavaScript and WebGL.</p></noscript>
        </div>

        <nav class="back-strip" aria-label="Site">
            <a href="/public/game/game.html">&larr; Arcade</a>
            <a href="/index.html">Robo Kyle</a>
            <a href="/about.html">About</a>
        </nav>
    </div>

    <script src="/public/site.js"></script>
    <script src="/public/game/fullscreen.js?v=33"></script>
    <script type="module" src="fly.js?v=16"></script>
</body>
</html>
